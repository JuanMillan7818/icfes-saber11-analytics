[project]
name = "icfes-saber11-analytics"
version = "0.1.0"
description = "Análisis microdatos ICFES Saber 11 (2015-2025)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
etl = [
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]
dashboard = [
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.3.0",
    "streamlit-option-menu>=0.3.6",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
cloud = [
    # DuckDB httpfs descarga extensiones en runtime; boto3 solo si se necesita SDK directo
    "boto3>=1.35.0",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
icfes-etl       = "icfes.etl.__main__:main"
icfes-dashboard = "icfes.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icfes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
